[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picture-to-print"
version = "0.1.0"
description = "Trellis raw mesh to validated, texture-free print geometry"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "trimesh>=5.2,<6", "scipy>=1.11,<2", "rtree>=1.4,<2"]

[project.optional-dependencies]
meshlib = ["meshlib==3.1.4.297"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20", "pillow>=11,<14", "modal>=1.6,<2"]
dev = ["pytest>=8,<10", "ruff>=0.17,<0.18", "httpx>=0.28,<1", "httpx2>=2,<3"]

[project.scripts]
picture-to-print = "picture_to_print.cli:main"

[tool.setuptools.packages.find]
include = ["picture_to_print*"]

[tool.setuptools.package-data]
picture_to_print = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
