name: print-geometry
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update
      - run: sudo apt-get install -y blender python3-numpy
      - run: python -m pip install '.[meshlib,web,dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: node --test tests/frontend-stages.test.cjs
